name: CodeQL

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: "23 3 * * 1"

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # SARIF upload requires a public repository or GitHub Advanced Security on private repos.
      # Without that, analyze fails at upload even when extraction succeeds.
      - name: Skip when code scanning cannot upload results
        if: ${{ github.event.repository.private }}
        run: |
          echo "Skipping CodeQL: private repositories need GitHub Advanced Security to upload code scanning results."
          echo "Make the repository public or enable Advanced Security, then re-run this workflow."

      - name: Checkout repository
        if: ${{ !github.event.repository.private }}
        uses: actions/checkout@v7

      - name: Setup .NET
        if: ${{ !github.event.repository.private }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json

      - name: Initialize CodeQL
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Perform CodeQL analysis
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
