name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore Espada.sln --locked-mode

      - name: Verify formatting
        run: dotnet format Espada.sln --no-restore --verify-no-changes

      - name: Build
        run: >
          dotnet build Espada.sln
          --configuration Release
          --no-restore
          -p:TreatWarningsAsErrors=true
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >
          dotnet test Espada.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./artifacts/test-results
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

  package-local-runtime:
    name: Package ${{ matrix.rid }}
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Espada.Web/package-lock.json

      - name: Build local runtime package
        shell: pwsh
        run: ./eng/Publish-LocalRuntime.ps1 -RuntimeIdentifier ${{ matrix.rid }}

      - name: Upload local runtime package
        uses: actions/upload-artifact@v7
        with:
          name: espada-${{ matrix.rid }}
          path: |
            artifacts/packages/espada-${{ matrix.rid }}.zip
            artifacts/packages/espada-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 14
