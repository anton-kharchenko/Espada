name: Deploy website

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/Espada.Web/**
      - .github/workflows/deploy-website.yml

permissions:
  contents: read

concurrency:
  group: espada-website-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Espada.Web/package-lock.json

      - name: Install dependencies
        working-directory: src/Espada.Web
        run: npm ci

      - name: Validate website
        working-directory: src/Espada.Web
        run: |
          npm run lint
          npm test
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/Espada.Web/dist
          output_location: ''
          skip_app_build: true
