version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"

      aspire:
        patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"

      testing:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"

      observability:
        patterns:
          - "OpenTelemetry*"
          - "Serilog*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Etc/UTC"
    groups:
      github-actions:
        patterns:
          - "*"